<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #111; }
  body { font-family: "General Sans", "Helvetica Neue", Arial, sans-serif; color: #fff; position: relative; }
  .bg { position: absolute; inset: 0; background: url(../../shared/hero-poster.jpg) 50% 38% / cover no-repeat; }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, #0000004d 0%, #00000014 30%, #000000a6 70%, #000000d9 100%); }
  .logo { position: absolute; top: 48px; left: 64px; display: flex; align-items: center; gap: 10px; font-size: 34px; font-weight: 600; letter-spacing: -.02em; }
  .logo svg { width: 48px; height: 28px; }
  .copy { position: absolute; left: 64px; right: 64px; bottom: 56px; }
  h1 { font-size: 68px; font-weight: 500; line-height: 1.02; letter-spacing: -.03em; }
  s { color: #ffffff8c; text-decoration-thickness: 5px; }
  p { margin-top: 22px; font-size: 26px; color: #ffffffd9; letter-spacing: -.01em; }
  .pill { position: absolute; top: 44px; right: 64px; background: #0a8448; border-radius: 999px; padding: 12px 24px; font-size: 22px; font-weight: 500; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="shade"></div>
  <div class="logo">
    <svg viewBox="0 0 34 20"><rect x="1.6" y="3.6" width="17.6" height="12.8" rx="6.4" fill="none" stroke="currentColor" stroke-width="3.2"/><rect x="14.8" y="3.6" width="17.6" height="12.8" rx="6.4" fill="none" stroke="currentColor" stroke-width="3.2"/></svg>
    nessoo
  </div>
  <div class="pill">Get verified</div>
  <div class="copy">
    <h1>You don’t <s>apply</s> to apartments.<br>Apartments apply to you.</h1>
    <p>Renters verify once. Landlords match and come to you.</p>
  </div>
</body>
</html>
